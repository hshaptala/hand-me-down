nelmio_api_doc:
    documentation:
        info:
            title: Hand me Down
            description: Hand me Down API !!
            version: 1.0.0
        components: 
            securitySchemes: 
                Bearer: 
                    type: http 
                    scheme: bearer
            schemas:
                Item:
                    type: object
                    properties:
                        id: 
                            type: integer
                        title: 
                            type: string
                        description:
                            type: string
                        donor:
                            type: integer
                            description: user id
                        receiver:
                            type: integer
                            description: user id
                        status:
                            type: string
                            description: "[Open, Reserved, Over]"
                        keywords:
                            type: array
                            items:
                                type: string
                        imageUrl: 
                            type: string
                            description: /images/items/1.png

    areas: # to filter documented areas
        path_patterns:
            - ^/api(?!/doc$) # Accepts routes under /api except /api/doc

nelmio_api_doc:
    documentation:
        info:
            title: Hand me Down
            description: Hand me Down API !!
            version: 1.0.0
        components: 
            securitySchemes: 
                Bearer: 
                    type: http 
                    scheme: bearer
    areas: # to filter documented areas
        path_patterns:
            - ^/api(?!/doc$) # Accepts routes under /api except /api/doc

# Read the documentation: https://fosrestbundle.readthedocs.io/en/3.x/
fos_rest:
    param_fetcher_listener: true
    allowed_methods_listener: true
    routing_loader: false
    view:
        view_response_listener: true
    format_listener:
        rules:
            - { path: ^/api, prefer_extension: true, fallback_format: json, priorities: [ json, html, xml ] }
            - { path: ^/, prefer_extension: false, fallback_format: html, priorities: [ html, json ] }
            - { path: ^/images, stop: true }